name: Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtshadertools qtimageformats'
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test spherical raster
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test native NAFNet inference
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 --output "$env:RUNNER_TEMP/nafnet-test.onnx" "https://raw.githubusercontent.com/rock1110/nafnet-onnx/main/nafnet-width32-gopro-fp32.onnx"
          if ($LASTEXITCODE -ne 0) { throw 'NAFNet model download failed' }
          & build/Release/PanoramaEditNativeAiTests.exe "$env:RUNNER_TEMP/nafnet-test.onnx"
          if ($LASTEXITCODE -ne 0) { throw 'Native ONNX Runtime inference failed' }
      - name: Deploy Qt
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix package
          windeployqt --release --compiler-runtime package/PanoramaEdit.exe
          $webp = Join-Path (qmake -query QT_INSTALL_PLUGINS) 'imageformats/qwebp.dll'
          if (!(Test-Path $webp)) { throw 'Qt WebP decoder not installed' }
          New-Item -ItemType Directory -Force package/imageformats | Out-Null
          Copy-Item $webp package/imageformats/qwebp.dll -Force
          if (!(Test-Path 'package/imageformats/qwebp.dll')) { throw 'Missing WebP decoder in package' }
          Copy-Item ai/setup_ai_windows.bat package/setup_ai_windows.bat
          foreach ($dll in @('onnxruntime.dll', 'onnxruntime_providers_shared.dll', 'DirectML.dll')) {
            if (!(Test-Path "package/$dll")) { throw "Missing native AI DLL: $dll" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PanoramaEdit-Windows-x64
          path: package/
